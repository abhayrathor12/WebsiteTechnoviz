<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Homepage tags. For every other page, api/render.js swaps the data-default-seo tags
         for that page's own before sending the HTML, and src/components/SEO.tsx takes over in the browser. -->
    <title>Technoviz Automation | Industry 4.0 &amp; IIoT Solutions India</title>
    <meta data-default-seo name="description" content="Technoviz Automation helps manufacturers go digital with Industry 4.0, IIoT, OEE dashboards, energy management, Vision AI and industrial automation." />
    <link data-default-seo rel="canonical" href="https://www.technovizautomation.com/" />

    <!-- Open Graph / Facebook -->
    <meta data-default-seo property="og:type" content="website" />
    <meta data-default-seo property="og:site_name" content="Technoviz Automation" />
    <meta data-default-seo property="og:url" content="https://www.technovizautomation.com/" />
    <meta data-default-seo property="og:title" content="Technoviz Automation | Industry 4.0 & Industrial Automation Solutions" />
    <meta data-default-seo property="og:description" content="Empowering manufacturers with Industry 4.0, IIoT, OEE dashboards, energy management and Vision AI. Driving efficiency, innovation and digital transformation." />
    <meta data-default-seo property="og:image" content="https://www.technovizautomation.com/og-image.jpg" />
    <meta data-default-seo property="og:image:width" content="1200" />
    <meta data-default-seo property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta data-default-seo name="twitter:card" content="summary_large_image" />
    <meta data-default-seo name="twitter:title" content="Technoviz Automation | Industry 4.0 & Industrial Automation Solutions" />
    <meta data-default-seo name="twitter:description" content="Empowering manufacturers with Industry 4.0, IIoT, OEE dashboards, energy management and Vision AI. Driving efficiency, innovation and digital transformation." />
    <meta data-default-seo name="twitter:image" content="https://www.technovizautomation.com/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script type="application/ld+json">
    {

      "description": "Technoviz Automation specializes in Industry 4.0, automation, and custom software development for industrial innovation.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "311, Paras Trade Center, Sector-2",
        "addressLocality": "Gurgaon",
        "addressRegion": "Haryana",
        "postalCode": "122011",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-9999765380",
        "contactType": "customer support",
        "email": "support@technovizautomation.com"
      },
      "sameAs": [
        "https://www.instagram.com/technovizautomation/",
        "https://www.linkedin.com/company/technovizautomation/",
        "https://www.facebook.com/technovizautomation",
        "https://www.youtube.com/@TechnovizAutomation"
      ]
    }
    </script>
